[workspace]
resolver = "2"
members = ["crates/pgferry", "crates/pgferry-bin"]

[workspace.dependencies]
tokio = { version = "1", features = [
  "net",
  "rt",
  "io-util",
  "macros",
  "time",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT/Apache-2.0"
