name: CI
on:
  schedule: [{cron: "30 13 * * *"}]
  push:
    branches:
      - master
  pull_request:

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  lint:
    name: Clippy lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    # pgferry has a single feature set (aws-lc-rs TLS on both pgwire
    # APIs), so there is no feature matrix to lint like upstream pgwire.
    - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust: [stable, nightly]
        # no windows: the pgwire dependency hardcodes the aws-lc-rs
        # feature set, which upstream pgwire's own CI also excludes on
        # Windows.
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - run: cargo test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
    - uses: actions/checkout@v6
    # scripts/e2e.sh needs initdb/pg_ctl/psql/pgbench plus a rust toolchain;
    # the flake dev shell provides all of them (postgresql_18 + fenix).
    # (no magic-nix-cache: it is no longer available to new repositories)
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: nicknovitski/nix-develop@v1
    - run: ./scripts/e2e.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    # 1.89: the MSRV of the pinned pgwire release; also required by this
    # workspace's edition-2024 let-chains.
    - uses: dtolnay/rust-toolchain@1.89
    - run: cargo build
